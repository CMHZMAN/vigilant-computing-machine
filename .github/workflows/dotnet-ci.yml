name: .NET CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Vcm.slnx

      - name: Build
        run: dotnet build Vcm.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Vcm.slnx --no-build --configuration Release
